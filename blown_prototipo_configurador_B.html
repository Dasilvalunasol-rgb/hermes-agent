};
const PACKS={solo:{n:'La B',d:'Recipiente + 1 cartucho (80 tissues)',p:0},ritual:{n:'B Rituel',d:'Recipiente + 3 cartuchos',p:24},founder:{n:'Founder Edition',d:'Numerada y grabada + 6 cartuchos + caja',p:60}};
const BASE=89;let curF='magenta',curP='solo';
function setAttr(sel,attr,val){document.querySelectorAll(sel).forEach(e=>e.setAttribute(attr,val))}
function apply(){const F=FIN[curF];
 setAttr('.fl1','stop-color',F.l);setAttr('.fl2','stop-color',F.m);setAttr('.fl3','stop-color',F.d);
 setAttr('.fs1','stop-color',F.s1);setAttr('.fs2','stop-color',F.s2);
 setAttr('.fw1','stop-color',F.w1);setAttr('.fw2','stop-color',F.w2);setAttr('.fw3','stop-color',F.w3);
 setAttr('.wb','fill',F.wb);
 document.getElementById('glowE').setAttribute('fill',F.glow);
 document.getElementById('keyline').setAttribute('stroke',F.key);
 document.getElementById('gridline').setAttribute('stroke',F.grid);
 document.getElementById('grilleLine').setAttribute('stroke',F.grille);
 document.getElementById('grilleBg').setAttribute('fill',F.gbg);
 document.getElementById('gridpath').setAttribute('opacity',F.gop||0.32);
 document.getElementById('griddot').setAttribute('fill',F.grid);
 document.getElementById('dglyph').setAttribute('stroke',F.key);
 document.getElementById('drefl').setAttribute('fill',F.key);
 document.getElementById('pring').setAttribute('stroke',F.key);
 document.getElementById('swname').textContent=F.n;
 const pvp=BASE+F.p+PACKS[curP].p,fo=Math.round(pvp*0.7);
 document.getElementById('pf').textContent=fo+' €';document.getElementById('pvp').textContent=pvp+' €';
 document.querySelectorAll('#swatches button').forEach(b=>b.classList.toggle('on',b.dataset.k===curF));
 document.querySelectorAll('#packs label').forEach(l=>l.classList.toggle('on',l.dataset.k===curP));
}
const sw=document.getElementById('swatches');
Object.keys(FIN).forEach(k=>{const b=document.createElement('button');b.dataset.k=k;b.style.background=FIN[k].sw;b.setAttribute('aria-label',FIN[k].n);b.onclick=()=>{curF=k;apply()};sw.appendChild(b)});
const pk=document.getElementById('packs');
Object.keys(PACKS).forEach(k=>{const l=document.createElement('label');l.dataset.k=k;l.innerHTML='<div class="pn">'+PACKS[k].n+(PACKS[k].p?' · +'+PACKS[k].p+' €':'')+'</div><div class="pd">'+PACKS[k].d+'</div>';l.onclick=()=>{curP=k;apply()};pk.appendChild(l)});
const svg=document.getElementById('bsvg');
function fire(c){svg.classList.remove('goL','goC');void svg.getBoundingClientRect();requestAnimationFrame(()=>svg.classList.add(c))}
document.getElementById('dbtn').addEventListener('click',()=>fire('goC'));
document.getElementById('bbtn').addEventListener('click',()=>fire('goL'));
document.getElementById('cta').addEventListener('click',()=>{const F=FIN[curF],pvp=BASE+F.p+PACKS[curP].p,fo=Math.round(pvp*0.7);if(window.sendPrompt){sendPrompt('Reserva fundador: acabado '+F.n+', pack '+PACKS[curP].n+', precio fundador '+fo+' €')}else{document.getElementById('cta').textContent='RESERVADO · '+fo+' €'}});
apply();
