<style>
  :root{--ink:#f3f3f6;--muted:#9aa0aa;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0c;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    padding:40px 22px 70px;-webkit-font-smoothing:antialiased}
  header{max-width:1180px;margin:0 auto 26px;text-align:center}
  header h1{font-family:Georgia,serif;font-weight:700;font-size:34px;letter-spacing:1px}
  header p{color:var(--muted);font-size:14px;margin-top:8px}
  .grid{max-width:1180px;margin:0 auto;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .card{background:#0e0e11;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .stage{background:#000}
  .stage svg{width:100%;height:auto;display:block}
  figcaption{display:flex;align-items:center;justify-content:space-between;
    padding:13px 16px;border-top:1px solid var(--line)}
  .nm{font-family:Georgia,serif;font-size:16px;letter-spacing:.3px}
  .chips{display:flex;gap:6px}
  .chip{width:15px;height:15px;border-radius:50%;border:1px solid rgba(255,255,255,.22)}
  footer{max-width:1180px;margin:30px auto 0;color:var(--muted);font-size:12px;
    text-align:center;border-top:1px solid var(--line);padding-top:18px}

  /* shared press animation */
  .m2 .btn{animation:m2press 4s ease-in-out infinite;transform-origin:350px 230px}
  @keyframes m2press{0%,16%{transform:translateY(0)}23%{transform:translateY(7px)}32%,100%{transform:translateY(0)}}
  .m2 .glow{animation:m2flash 4s ease-in-out infinite}
  @keyframes m2flash{0%,16%{opacity:.3}24%{opacity:1}45%,100%{opacity:.4}}
  .m2 .w1{animation:m2o1 4s ease-in-out infinite}
  @keyframes m2o1{0%,24%{transform:translateX(42px);opacity:0}34%{opacity:1}48%,84%{transform:translateX(0);opacity:1}95%,100%{transform:translateX(42px);opacity:0}}
  .m2 .w2{animation:m2o2 4s ease-in-out infinite}
  @keyframes m2o2{0%,34%{transform:translate(48px,0);opacity:0}44%{opacity:1}58%,82%{transform:translate(8px,5px);opacity:1}93%,100%{transform:translate(48px,0);opacity:0}}
  .m2 .press-ring{animation:m2tap 4s ease-in-out infinite;transform-origin:350px 228px}
  @keyframes m2tap{0%,15%{opacity:0;transform:scale(.4)}24%{opacity:.7;transform:scale(1)}40%,100%{opacity:0;transform:scale(1.3)}}

  @media (prefers-reduced-motion: reduce){
    .m2 .btn,.m2 .glow,.m2 .w1,.m2 .w2,.m2 .press-ring{animation:none}
    .m2 .glow{opacity:.85} .m2 .w1,.m2 .w2{opacity:1;transform:none}
    .m2 .press-ring{opacity:0}
  }
</style></head>
